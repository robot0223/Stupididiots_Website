name: Build journal

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'assets/posts/**'
      - 'scripts/build_posts.py'
      - 'scripts/test_posts.py'
      - 'scripts/templates/**'
      - '.github/workflows/build-posts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'posts/**'
      - 'assets/posts/**'
      - 'scripts/build_posts.py'
      - 'scripts/test_posts.py'
      - 'scripts/templates/**'
      - '.github/workflows/build-posts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the publisher
        run: python scripts/test_posts.py
      - name: Validate posts without changing generated pages
        run: python scripts/build_posts.py --check
  build:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the current branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the publisher
        run: python scripts/test_posts.py
      - name: Validate and build posts
        run: python scripts/build_posts.py
      - name: Commit generated pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from build_posts import MANIFEST, PROJECTS, owned_name, read_manifest

          previous = subprocess.run(
              ['git', 'show', f'HEAD:journal/{MANIFEST}'],
              capture_output=True, text=True,
          )
          old = json.loads(previous.stdout) if previous.returncode == 0 else []
          if not isinstance(old, list) or not all(isinstance(name, str) and owned_name(name) for name in old):
              raise SystemExit('Unsafe previous generated-file manifest; refusing to stage files.')
          names = set(old) | read_manifest(Path('journal'))
          paths = [f'journal/{name}' for name in sorted(names)] + [f'journal/{MANIFEST}', 'index.html']
          paths += [f'projects/{slug}.html' for slug in PROJECTS]
          # Stage only generated journal files and the known pages containing generated cards.
          subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          PY
          if git diff --cached --quiet; then
            echo 'Generated pages are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build member journal'
          # A normal push fails safely if the branch changed while this job ran.
          # Never force-push, rebase generated changes, or overwrite a member's commit.
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
